name: Build Windows app

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish HeatTurbo
        shell: pwsh
        run: dotnet publish HeatTurbo.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o release/win-x64
      - uses: actions/upload-artifact@v4
        with:
          name: HeatTurbo-windows-x64
          path: release/win-x64
          if-no-files-found: error
