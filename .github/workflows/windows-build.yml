name: Build Windows app

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Check interface JavaScript
        shell: pwsh
        run: node --check wwwroot/js/site.js
      - name: Validate package version
        shell: pwsh
        run: |
          $projectText = Get-Content HeatTurbo.csproj -Raw
          $installerText = Get-Content installer\HeatTurboSetup.iss -Raw
          $projectVersion = [regex]::Match($projectText, '<Version>([^<]+)</Version>').Groups[1].Value
          $installerVersion = [regex]::Match($installerText, '#define MyAppVersion "([^"]+)"').Groups[1].Value
          if (-not $projectVersion -or $projectVersion -ne $installerVersion) {
            throw "Versões divergentes: projeto=$projectVersion instalador=$installerVersion"
          }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$projectVersion") {
            throw "A tag $env:GITHUB_REF_NAME não corresponde à versão v$projectVersion"
          }
      - name: Publish HeatTurbo
        shell: pwsh
        run: dotnet publish HeatTurbo.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o release/win-x64
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress
      - name: Build installer
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\HeatTurboSetup.iss'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: HeatTurbo-windows-x64
          path: release/win-x64
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: HeatTurbo-Installer
          path: release/installer/HeatTurbo-Setup.exe
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: HeatTurbo-Installer
          path: release/installer
      - name: Publish versioned release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: release/installer/HeatTurbo-Setup.exe
          generate_release_notes: true
          make_latest: true
